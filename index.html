<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>IT ExamPro — Join Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Nunito,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem;}
.card{background:#1e293b;border-radius:20px;padding:2rem 1.5rem;width:100%;max-width:420px;box-shadow:0 8px 40px rgba(0,0,0,.4);}
h1{font-size:1.6rem;font-weight:900;color:#fff;margin-bottom:.3rem;}
.sub{font-size:.82rem;color:#64748b;margin-bottom:1.5rem;}
input{width:100%;padding:12px 16px;border:2px solid #334155;border-radius:10px;background:#0f172a;color:#fff;font-size:1rem;font-family:Nunito,sans-serif;outline:none;margin-bottom:.8rem;}
input:focus{border-color:#3b82f6;}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-size:1rem;font-weight:900;cursor:pointer;font-family:Nunito,sans-serif;}
.btn-blue{background:#3b82f6;color:#fff;}
.btn-green{background:#22c55e;color:#fff;}
.btn-ghost{background:#334155;color:#e2e8f0;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.err{color:#ef4444;font-size:.82rem;margin-bottom:.8rem;text-align:center;}
.status{color:#94a3b8;font-size:.85rem;text-align:center;margin-top:.8rem;}

/* Question screen */
.opt{display:flex;align-items:center;gap:12px;padding:1rem 1.2rem;border-radius:14px;font-weight:800;font-size:1rem;color:#fff;cursor:pointer;margin-bottom:.7rem;border:3px solid transparent;transition:transform .1s,border-color .1s;user-select:none;}
.opt:active{transform:scale(.97);}
.opt.selected{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.2);}
.opt.correct{border-color:#22c55e!important;box-shadow:0 0 0 4px rgba(34,197,94,.3);}
.opt.wrong{opacity:.55;}
.opt-shape{font-size:1.4rem;min-width:28px;}
.tf-grid{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin-bottom:.8rem;}
.tf-btn{padding:1.5rem;border-radius:14px;font-weight:900;font-size:1.2rem;color:#fff;cursor:pointer;text-align:center;border:3px solid transparent;transition:transform .1s;}
.tf-btn:active{transform:scale(.97);}

/* Timer bar */
.timer-wrap{margin-bottom:1.2rem;}
.timer-bar-bg{background:#334155;border-radius:999px;height:10px;overflow:hidden;}
.timer-bar{height:100%;border-radius:999px;transition:width 1s linear;}
.timer-num{font-size:2rem;font-weight:900;font-family:monospace;text-align:center;margin-bottom:.5rem;}

/* Leaderboard */
.lb-row{display:flex;align-items:center;gap:10px;padding:.5rem .3rem;border-bottom:1px solid rgba(255,255,255,.05);}
.lb-rank{font-size:.9rem;font-weight:900;min-width:32px;text-align:center;}
.lb-name{flex:1;font-weight:800;font-size:.88rem;}
.lb-score{font-weight:900;font-size:.92rem;color:#f59e0b;}
.lb-gain{font-size:.7rem;color:#22c55e;}

/* Team talk */
.team-talk-screen{text-align:center;padding:1rem 0;}
.tt-count{font-size:5rem;font-weight:900;color:#7c3aed;font-family:monospace;line-height:1;}

/* Podium */
.podium-wrap{display:flex;justify-content:center;align-items:flex-end;gap:.7rem;margin:1.5rem 0;}
.podium-col{display:flex;flex-direction:column;align-items:center;flex:1;max-width:110px;}
.podium-block{width:100%;border-radius:8px 8px 0 0;display:flex;align-items:center;justify-content:center;}
</style>
</head>
<body>
<div class="card" id="app"></div>
<script>
var SURL = 'https://script.google.com/macros/s/AKfycbxrrDxbVlTP1u5oyR776zVOfG3gTMK1mIPFeh9qFIbTFYaOA8RL5tFseH99-c0JTq7p/exec';
var state='pin'; /* pin → name → teamjoin → waiting → teamtalk → question → answered → leaderboard → done */
var pin='',myId='',myName='',myClass='',myTeam='',sessionData=null,currentQ=null;
var pollTimer=null,countdownTimer=null,timeLeft=0,answered=false;
var teamTalkTimer=null;
var COLORS=['#ef4444','#3b82f6','#22c55e','#f59e0b','#a855f7','#ec4899'];
var SHAPES=['▲','◆','●','■','★','♥'];

function uid(){return 'st_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function render(html){document.getElementById('app').innerHTML=html;}

/* ── PIN SCREEN ── */
function showPin(){
  state='pin';
  render('<h1>🎮 Join Quiz</h1><div class="sub">Enter the game PIN from your teacher</div>'
    +'<input id="pin-in" type="number" placeholder="Game PIN" maxlength="6" oninput="this.value=this.value.slice(0,6)">'
    +'<div class="err" id="pin-err"></div>'
    +'<button class="btn btn-blue" onclick="submitPin()">Join →</button>');
  var el=document.getElementById('pin-in');
  if(el) el.focus();
}

async function submitPin(){
  var p=(document.getElementById('pin-in')||{}).value||'';
  if(p.length<4){document.getElementById('pin-err').textContent='Enter a valid PIN';return;}
  document.getElementById('pin-err').textContent='Checking…';
  try{
    var r=await fetch(SURL+'?action=lqGetSession&pin='+p+'&t='+Date.now());
    var j=await r.json();
    if(!j.ok||!j.session){document.getElementById('pin-err').textContent='PIN not found or session ended';return;}
    if(j.session.status!=='lobby'){document.getElementById('pin-err').textContent='Game already started';return;}
    pin=p;
    sessionData=j.session;
    showName();
  }catch(e){document.getElementById('pin-err').textContent='Connection error';}
}

/* ── NAME SCREEN ── */
function showName(){
  state='name';
  var mode=sessionData.mode||'individual';
  render('<h1>👋 Your Name</h1><div class="sub">Session: <strong>'+esc(sessionData.name)+'</strong></div>'
    +'<input id="name-in" placeholder="Your name" maxlength="30">'
    +'<select id="class-in" style="width:100%;padding:12px 16px;border:2px solid #334155;border-radius:10px;background:#0f172a;color:#fff;font-size:1rem;font-family:Nunito,sans-serif;outline:none;margin-bottom:.8rem;appearance:none;-webkit-appearance:none;cursor:pointer;"><option value="">Select your class</option><option value="7-1">7-1</option><option value="7-2">7-2</option><option value="7-3">7-3</option><option value="7-4">7-4</option><option value="8-1">8-1</option><option value="8-2">8-2</option><option value="8-3">8-3</option><option value="8-4">8-4</option><option value="9-1">9-1</option><option value="9-2">9-2</option><option value="9-3">9-3</option><option value="9-4">9-4</option><option value="10 Arts">10 Arts</option><option value="10 Business">10 Business</option><option value="10 TVET 1">10 TVET 1</option><option value="10 TVET 2">10 TVET 2</option><option value="10 CVQ 1">10 CVQ 1</option><option value="10 CVQ 2">10 CVQ 2</option><option value="11 Arts">11 Arts</option><option value="11 Business">11 Business</option><option value="11 TVET 1">11 TVET 1</option><option value="11 TVET 2">11 TVET 2</option><option value="11 CVQ 1">11 CVQ 1</option><option value="11 CVQ 2">11 CVQ 2</option></select>'
    +'<div class="err" id="name-err"></div>'
    +'<button class="btn btn-blue" onclick="submitName()">Next →</button>');
  document.getElementById('name-in').focus();
}

async function submitName(){
  var n=(document.getElementById('name-in')||{}).value.trim();
  var c=(document.getElementById('class-in')||{}).value.trim();
  if(!n){document.getElementById('name-err').textContent='Enter your name';return;}
  myName=n; myClass=c;
  if(!myId) myId=uid();
  var mode=sessionData.mode||'individual';
  if(mode==='shared') showTeamShared();
  else if(mode==='pooled') showTeamPooled();
  else await joinSession();
}

/* ── TEAM SHARED SCREEN ── */
function showTeamShared(){
  state='teamjoin';
  render('<h1>🤝 Your Team</h1><div class="sub">One device per team. Enter your team name and all members.</div>'
    +'<input id="team-name-in" placeholder="Team name (e.g. Team Falcon)" maxlength="30">'
    +'<textarea id="team-members-in" placeholder="Member names, one per line" rows="4" style="width:100%;padding:12px;border:2px solid #334155;border-radius:10px;background:#0f172a;color:#fff;font-size:.9rem;font-family:Nunito,sans-serif;outline:none;resize:vertical;margin-bottom:.8rem;"></textarea>'
    +'<div class="err" id="team-err"></div>'
    +'<button class="btn btn-blue" onclick="submitTeamShared()">Join as Team →</button>');
}

async function submitTeamShared(){
  var tname=(document.getElementById('team-name-in')||{}).value.trim();
  var membersRaw=(document.getElementById('team-members-in')||{}).value||'';
  var members=membersRaw.split('\n').map(function(s){return s.trim();}).filter(Boolean);
  if(!tname){document.getElementById('team-err').textContent='Enter a team name';return;}
  if(!members.length) members=[myName];
  myTeam=tname;
  await joinSession(tname, members);
}

/* ── TEAM POOLED SCREEN ── */
function showTeamPooled(){
  state='teamjoin';
  render('<h1>👥 Pick Your Team</h1><div class="sub">Join an existing team or create a new one.</div>'
    +'<input id="team-in" placeholder="Team name (join or create)" maxlength="30" list="team-list">'
    +'<datalist id="team-list"></datalist>'
    +'<div class="err" id="team-err"></div>'
    +'<button class="btn btn-blue" onclick="submitTeamPooled()">Join →</button>');
  /* Load existing teams from current players */
  loadTeamsForPooled();
}

async function loadTeamsForPooled(){
  try{
    var r=await fetch(SURL+'?action=lqGetSession&pin='+pin+'&t='+Date.now());
    var j=await r.json();
    if(!j.ok||!j.session) return;
    var players=JSON.parse(j.session.players||'[]');
    var teams={};
    players.forEach(function(p){if(p.teamName) teams[p.teamName]=true;});
    var dl=document.getElementById('team-list');
    if(dl) dl.innerHTML=Object.keys(teams).map(function(t){return '<option value="'+esc(t)+'">'+esc(t)+'</option>';}).join('');
  }catch(e){}
}

async function submitTeamPooled(){
  var tname=(document.getElementById('team-in')||{}).value.trim();
  if(!tname){document.getElementById('team-err').textContent='Enter or pick a team name';return;}
  myTeam=tname;
  await joinSession(tname, null);
}

/* ── JOIN SESSION ── */
async function joinSession(teamName, members){
  try{
    var params='?action=lqJoin'
      +'&pin='+encodeURIComponent(pin)
      +'&studentId='+encodeURIComponent(myId)
      +'&name='+encodeURIComponent(myName)
      +'&cls='+encodeURIComponent(myClass)
      +'&teamName='+encodeURIComponent(teamName||'')
      +'&members='+encodeURIComponent(JSON.stringify(members||[]))
      +'&t='+Date.now();
    var r=await fetch(SURL+params);
    var j=await r.json();
    if(!j.ok) throw new Error(j.error||'Join failed');
    showWaiting();
    startPolling();
  }catch(e){
    var err=document.getElementById('name-err')||document.getElementById('team-err');
    if(err) err.textContent='Could not join: '+e.message;
  }
}

/* ── WAITING SCREEN ── */
function showWaiting(){
  state='waiting';
  var mode=sessionData.mode||'individual';
  var teamLine=myTeam?'<div style="margin-top:.5rem;font-size:.82rem;color:#7c3aed;font-weight:800;">🎯 '+esc(myTeam)+'</div>':'';
  render('<h1 style="font-size:1.3rem;">⏳ Waiting for teacher…</h1>'
    +'<div class="sub">Game: <strong>'+esc(sessionData.name||'')+'</strong></div>'
    +'<div style="margin:1.5rem 0;padding:1rem;background:#0f172a;border-radius:12px;text-align:center;">'
    +'<div style="font-size:1rem;color:#94a3b8;">Joined as</div>'
    +'<div style="font-size:1.3rem;font-weight:900;color:#fff;margin-top:.3rem;">'+esc(myName)+'</div>'
    +teamLine
    +'</div>'
    +'<div class="status" id="wait-status">Waiting for the game to start…</div>');
}

/* ── TEAM TALK SCREEN ── */
function showTeamTalk(secs){
  state='teamtalk';
  render('<div class="team-talk-screen">'
    +'<div style="font-size:1.4rem;font-weight:900;color:#fff;margin-bottom:.5rem;">💬 Team Talk!</div>'
    +'<div style="font-size:.85rem;color:#94a3b8;margin-bottom:1.5rem;">Discuss with your team before answering</div>'
    +'<div class="tt-count" id="tt-num">'+secs+'</div>'
    +'<div style="font-size:.78rem;color:#64748b;margin-top:1rem;">Answer unlocks when timer ends</div>'
    +'</div>');
  var t=secs;
  if(teamTalkTimer) clearInterval(teamTalkTimer);
  teamTalkTimer=setInterval(function(){
    t--;
    var el=document.getElementById('tt-num');
    if(el) el.textContent=t;
    if(t<=0){ clearInterval(teamTalkTimer); showQuestion(); }
  },1000);
}

/* ── QUESTION SCREEN ── */
function showQuestion(){
  if(!currentQ) return;
  state='question';
  answered=false;
  var q=currentQ;
  var t=q._type||q.type;
  var timer=parseInt(sessionData.timer)||30;
  timeLeft=timer;

  var h='<div style="font-size:.72rem;font-weight:900;color:#94a3b8;margin-bottom:.5rem;">Q'+(q.idx+1)+'</div>';
  h+='<div class="timer-wrap"><div class="timer-num" id="st-timer">'+timeLeft+'</div>'
    +'<div class="timer-bar-bg"><div class="timer-bar" id="st-bar" style="width:100%;background:#22c55e;"></div></div></div>';
  h+='<div style="font-size:1.1rem;font-weight:900;color:#fff;margin-bottom:1.2rem;line-height:1.4;">'+esc(q.q||q.title||'')+'</div>';

  if(t==='mcq'){
    (q.opts||[]).forEach(function(opt,i){
      h+='<div class="opt" style="background:'+COLORS[i%COLORS.length]+';" onclick="submitAnswer('+i+')" id="opt-'+i+'">'
        +'<span class="opt-shape">'+SHAPES[i%SHAPES.length]+'</span>'
        +'<span>'+esc(opt)+'</span></div>';
    });
  } else if(t==='tf'){
    h+='<div class="tf-grid">'
      +'<div class="tf-btn" style="background:#22c55e;" onclick="submitAnswer(\'true\')">✓ TRUE</div>'
      +'<div class="tf-btn" style="background:#ef4444;" onclick="submitAnswer(\'false\')">✗ FALSE</div>'
      +'</div>';
  }
  h+='<div class="err" id="ans-status"></div>';
  render(h);
  startCountdown(timer);
}

function startCountdown(secs){
  if(countdownTimer) clearInterval(countdownTimer);
  countdownTimer=setInterval(function(){
    timeLeft--;
    var el=document.getElementById('st-timer');
    if(el){ el.textContent=timeLeft; el.style.color=timeLeft<=5?'#ef4444':timeLeft<=10?'#f59e0b':'#fff'; }
    var bar=document.getElementById('st-bar');
    if(bar){
      var pct=Math.round(timeLeft/secs*100);
      bar.style.width=pct+'%';
      bar.style.background=pct>33?'#22c55e':pct>15?'#f59e0b':'#ef4444';
    }
    if(timeLeft<=0){ clearInterval(countdownTimer); if(!answered) showTimeUp(); }
  },1000);
}

async function submitAnswer(ans){
  if(answered) return;
  answered=true;
  if(countdownTimer) clearInterval(countdownTimer);
  var elapsed=parseInt(sessionData.timer||30)-timeLeft;
  /* Grey out options */
  document.querySelectorAll('.opt,.tf-btn').forEach(function(el){el.style.opacity='.6';el.style.cursor='default';});
  var st=document.getElementById('ans-status');
  if(st) st.textContent='✅ Answer submitted!';
  try{
    await fetch(SURL+'?action=lqSubmitAnswer'
      +'&pin='+encodeURIComponent(pin)
      +'&studentId='+encodeURIComponent(myId)
      +'&questionIdx='+(currentQ.idx)
      +'&answer='+encodeURIComponent(JSON.stringify(ans))
      +'&responseTime='+elapsed
      +'&t='+Date.now());
  }catch(e){ console.warn('submit error',e); }
  state='answered';
}

function showTimeUp(){
  answered=true;
  state='answered';
  var st=document.getElementById('ans-status');
  if(st) st.textContent='⏰ Time up!';
}

/* ── BETWEEN-QUESTION LEADERBOARD SCREEN ── */
function showLeaderboard(lbData, isLast){
  if(countdownTimer) clearInterval(countdownTimer);
  if(teamTalkTimer) clearInterval(teamTalkTimer);
  state='leaderboard';
  var mode=sessionData.mode||'individual';
  var medals=['🥇','🥈','🥉'];
  var myRank=null, myScore=0;

  var h='<div style="background:linear-gradient(135deg,#1e1b4b,#312e81);border-radius:16px;padding:1.2rem;margin:-1.5rem -1.5rem 1rem;">';
  h+='<div style="font-size:1.3rem;font-weight:900;color:#fff;text-align:center;">🏆 Leaderboard</div>';
  h+='<div style="font-size:.75rem;color:rgba(255,255,255,.5);text-align:center;margin-top:.2rem;">After question '+(currentQ?currentQ.idx+1:'?')+'</div>';
  h+='</div>';

  if(lbData&&lbData.length){
    lbData.forEach(function(entry,i){
      var isMe=(mode==='individual')?(entry.name===myName):(entry.name===myTeam);
      if(isMe){ myRank=entry.rank; myScore=entry.score; }
      var isTop=i<3;
      h+='<div class="lb-row" style="'+(isMe?'background:rgba(59,130,246,.12);border-radius:8px;':'')+'">';
      h+='<div class="lb-rank" style="color:'+(isTop?'#f59e0b':'#64748b')+';font-size:'+(isTop?'1.1rem':'.82rem')+';">'+(isTop?medals[i]:'#'+entry.rank)+'</div>';
      h+='<div class="lb-name" style="color:'+(isMe?'#60a5fa':'#e2e8f0')+';">'+esc(entry.name)+(isMe?' 👈':'')+'</div>';
      h+='<div style="text-align:right;">';
      h+='<div class="lb-score">'+entry.score+'</div>';
      if(entry.lastGain>0) h+='<div class="lb-gain">+'+entry.lastGain+'</div>';
      h+='</div></div>';
    });
  } else {
    h+='<div style="text-align:center;color:#64748b;padding:1rem;">Waiting for scores…</div>';
  }

  if(myRank) h+='<div style="margin-top:1rem;padding:.8rem;background:#1e293b;border-radius:10px;text-align:center;font-size:.85rem;color:#94a3b8;">You are <strong style="color:#f59e0b;">#'+myRank+'</strong> with <strong style="color:#fff;">'+myScore+' pts</strong></div>';
  if(isLast) h+='<div style="margin-top:1rem;text-align:center;color:#64748b;font-size:.82rem;">⏳ Waiting for final results…</div>';
  else h+='<div style="margin-top:1rem;text-align:center;color:#64748b;font-size:.82rem;">⏳ Next question coming soon…</div>';

  render(h);
}

/* ── DONE SCREEN ── */
function showDone(lbData){
  if(countdownTimer) clearInterval(countdownTimer);
  if(pollTimer) clearInterval(pollTimer);
  state='done';
  var medals=['🥇','🥈','🥉'];
  var h='<div style="text-align:center;margin-bottom:1.5rem;">';
  h+='<div style="font-size:2.5rem;">🎉</div>';
  h+='<div style="font-size:1.5rem;font-weight:900;color:#fff;margin-top:.5rem;">Game Over!</div>';
  h+='<div style="font-size:.82rem;color:#64748b;">'+esc(sessionData.name||'Quiz')+'</div></div>';

  /* Find my position */
  var myEntry=null;
  var mode=sessionData.mode||'individual';
  if(lbData) lbData.forEach(function(e){ if(mode==='individual'?e.name===myName:e.name===myTeam) myEntry=e; });
  if(myEntry){
    h+='<div style="background:linear-gradient(135deg,#1e1b4b,#312e81);border-radius:14px;padding:1.2rem;text-align:center;margin-bottom:1rem;">';
    h+='<div style="font-size:.8rem;color:rgba(255,255,255,.6);">Your final position</div>';
    h+='<div style="font-size:2.5rem;font-weight:900;color:#f59e0b;margin:.3rem 0;">'+(myEntry.rank<=3?medals[myEntry.rank-1]:'#'+myEntry.rank)+'</div>';
    h+='<div style="font-size:1.3rem;font-weight:900;color:#fff;">'+myEntry.score+' pts</div></div>';
  }

  if(lbData&&lbData.length){
    h+='<div style="font-size:.76rem;font-weight:800;color:#94a3b8;margin-bottom:.5rem;">FINAL STANDINGS</div>';
    lbData.slice(0,10).forEach(function(e,i){
      var isMe=mode==='individual'?e.name===myName:e.name===myTeam;
      var isTop=i<3;
      h+='<div class="lb-row" style="'+(isMe?'background:rgba(59,130,246,.12);border-radius:8px;':'')+'">';
      h+='<div class="lb-rank" style="color:'+(isTop?'#f59e0b':'#64748b')+';">'+(isTop?medals[i]:'#'+e.rank)+'</div>';
      h+='<div class="lb-name" style="color:'+(isMe?'#60a5fa':'#e2e8f0')+';">'+esc(e.name)+(isMe?' 👈':'')+'</div>';
      h+='<div class="lb-score">'+e.score+'</div></div>';
    });
  }
  /* Play Again button */
  h+='<div style="margin-top:1.5rem;text-align:center;">';
  h+='<button class="btn btn-blue" onclick="playAgain()" style="padding:12px 28px;font-size:.95rem;">🔄 Play Again</button>';
  h+='</div>';
  h+='<div style="margin-top:.8rem;text-align:center;font-size:.75rem;color:#475569;" id="pa-countdown"></div>';
  render(h);

  /* Auto-reset to join screen after 30 seconds */
  var paCount=30;
  var paTimer=setInterval(function(){
    paCount--;
    var el=document.getElementById('pa-countdown');
    if(el) el.textContent='Returning to join screen in '+paCount+'s…';
    if(paCount<=0){ clearInterval(paTimer); playAgain(); }
  },1000);
}

function playAgain(){
  /* Reset all state and go back to PIN screen */
  pin=''; myId=''; myName=''; myClass=''; myTeam='';
  sessionData=null; currentQ=null; answered=false;
  stopPolling();
  if(countdownTimer) clearInterval(countdownTimer);
  if(teamTalkTimer) clearInterval(teamTalkTimer);
  showPin();
}

/* ── POLLING ── */
function startPolling(){
  stopPolling();
  pollTimer=setInterval(poll, 2500);
  poll();
}
function stopPolling(){
  if(pollTimer) clearInterval(pollTimer);
  pollTimer=null;
}

async function poll(){
  try{
    var r=await fetch(SURL+'?action=lqGetSession&pin='+pin+'&studentId='+myId+'&t='+Date.now());
    if(!r.ok) return;
    var j=await r.json();
    if(!j.ok||!j.session) return;
    var srv=j.session;
    sessionData=srv;

    var status=srv.status;
    var qIdx=parseInt(srv.currentQ||0);
    var lbData=null;
    try{ lbData=JSON.parse(srv.leaderboard||'null'); }catch(e){}

    if(status==='ended'||status==='cancelled'){
      stopPolling();
      var finalLb=null;
      try{ finalLb=JSON.parse(srv.leaderboard||'null'); }catch(e){}
      showDone(finalLb);
      return;
    }

    if(status==='leaderboard'){
      /* Show between-question leaderboard */
      if(state!=='leaderboard'){
        var isLast=(qIdx+1)>=(parseInt(srv.totalQuestions)||1);
        showLeaderboard(lbData, isLast);
      }
      return;
    }

    if(status==='question'){
      /* New question incoming */
      var newQ=null;
      try{ var qs=JSON.parse(srv.questions||'[]'); newQ=qs[qIdx]; if(newQ) newQ.idx=qIdx; }catch(e){}
      if(!newQ) return;

      if(!currentQ||currentQ.idx!==qIdx){
        currentQ=newQ;
        var mode=srv.mode||'individual';
        var teamTalk=parseInt(srv.teamTalk||0);
        if(mode==='shared'&&teamTalk>0&&state!=='teamtalk'){
          showTeamTalk(teamTalk);
        } else if(state!=='question'&&state!=='answered'){
          showQuestion();
        }
      }
      return;
    }

    if(status==='lobby'&&(state==='waiting'||state==='pin')){
      /* Still in lobby */
      var ws=document.getElementById('wait-status');
      var cnt=0; try{ cnt=JSON.parse(srv.players||'[]').length; }catch(e){}
      if(ws) ws.textContent=cnt+' player(s) joined — waiting for teacher to start…';
    }
  }catch(e){ console.warn('poll error',e); }
}

/* ── INIT ── */
showPin();
</script>
