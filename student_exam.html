*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--canvas);color:var(--text);min-height:100vh;}

/* ── Header ── */
.header{background:#fff;border-bottom:2px solid var(--border);padding:1rem 1.5rem;position:sticky;top:0;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,.06);}

.timer-box{background:var(--canvas2);border:2px solid var(--amber);border-radius:10px;padding:.4rem 1rem;font-size:1.2rem;font-weight:900;font-family:monospace;color:var(--amber);}
.timer-box.danger{border-color:var(--red);color:var(--red);animation:pulse .5s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.5;}}

/* ── Main ── */
.main{max-width:900px;margin:0 auto;padding:1.5rem;}

/* ── Info Card ── */
.info-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:1.5rem;margin-bottom:1.5rem;box-shadow:0 1px 3px rgba(0,0,0,.05);}

.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;}
.fi-label{font-size:.72rem;font-weight:700;color:var(--slate);text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px;}
.fi{width:100%;padding:10px 14px;border:2px solid var(--border);border-radius:9px;background:#fff;color:var(--charcoal);font-size:.95rem;font-weight:600;outline:none;transition:border-color .2s;}
.fi:focus{border-color:var(--blue);}
select.fi{cursor:pointer;}
select.fi option{background:#fff;color:var(--charcoal);}
select.fi optgroup{color:var(--slate);font-size:.75rem;}

/* ── Section ── */
.section{background:#fff;border:1px solid var(--border);border-radius:14px;padding:1.5rem;margin-bottom:1.2rem;box-shadow:0 1px 3px rgba(0,0,0,.05);}
.section-heading{display:flex;align-items:center;gap:.7rem;margin-bottom:1.2rem;padding-bottom:.7rem;border-bottom:1px solid var(--border);}
.section-heading h3{font-size:1rem;font-weight:800;color:var(--charcoal);}
.section-badge{background:var(--blue);color:#fff;font-size:.72rem;font-weight:800;padding:2px 8px;border-radius:999px;}
.section-marks{font-size:.75rem;color:var(--slate);margin-left:auto;font-weight:700;}

/* ── Question ── */
.question{margin-bottom:1.4rem;padding-bottom:1.4rem;border-bottom:1px solid var(--canvas2);}
.question:last-child{margin-bottom:0;padding-bottom:0;border-bottom:none;}
.q-num{font-size:.72rem;font-weight:800;color:var(--slate);text-transform:uppercase;margin-bottom:.3rem;}
.q-text{font-size:.98rem;font-weight:700;color:var(--charcoal);margin-bottom:.8rem;line-height:1.6;}
.q-marks{font-size:.72rem;color:var(--amber);font-weight:700;margin-bottom:.6rem;}

/* ── MCQ Options ── */
.opts{display:flex;flex-direction:column;gap:.5rem;}
.opt{display:flex;align-items:center;gap:.7rem;padding:.8rem 1rem;border:2px solid var(--border);border-radius:10px;cursor:pointer;transition:all .15s;background:#fff;}
.opt:hover{border-color:var(--blue);background:rgba(59,130,246,.04);}
.opt input[type=radio],.opt input[type=checkbox]{accent-color:var(--blue);width:16px;height:16px;flex-shrink:0;}
.opt.selected{border-color:var(--blue);background:rgba(59,130,246,.06);}
.opt.correct{border-color:var(--green);background:rgba(16,185,129,.08);}
.opt.wrong{border-color:var(--red);background:rgba(239,68,68,.05);opacity:.7;}
.opt-label{font-size:.92rem;font-weight:600;color:var(--charcoal);}
.opt-letter{font-size:.8rem;font-weight:900;color:var(--blue);min-width:20px;}

/* ── True/False ── */
.tf-opts{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;}
.tf-btn{padding:1rem;border:2px solid var(--border);border-radius:10px;font-weight:800;font-size:.95rem;cursor:pointer;text-align:center;transition:all .15s;background:#fff;color:var(--charcoal);}
.tf-true:hover,.tf-true.selected{border-color:var(--green);background:rgba(16,185,129,.08);color:var(--green);}
.tf-false:hover,.tf-false.selected{border-color:var(--red);background:rgba(239,68,68,.08);color:var(--red);}
.tf-btn.correct{border-color:var(--green);background:rgba(16,185,129,.1);}
.tf-btn.wrong{opacity:.5;}

/* ── Fill / Essay ── */
.fi-ans{width:100%;padding:10px 14px;border:2px solid var(--border);border-radius:9px;background:#fff;color:var(--charcoal);font-size:.95rem;font-weight:600;outline:none;transition:border-color .2s;resize:vertical;}
.fi-ans:focus{border-color:var(--blue);}
.fi-ans:disabled{background:var(--canvas2);opacity:.8;cursor:not-allowed;}

/* ── Match ── */
.match-row{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin-bottom:.5rem;align-items:center;}
.match-left{font-size:.88rem;font-weight:700;color:var(--charcoal);background:var(--canvas2);padding:.6rem .9rem;border-radius:8px;border:1px solid var(--border);}

/* ── Answer Key ── */
.answer-key{font-size:.78rem;color:var(--green);font-weight:700;margin-top:.5rem;padding:.4rem .8rem;background:rgba(16,185,129,.08);border-radius:6px;border:1px solid rgba(16,185,129,.25);}
.your-answer{font-size:.78rem;color:var(--slate);font-weight:600;margin-top:.3rem;}

/* ── Submit Bar ── */
.submit-bar{background:#fff;border:1px solid var(--border);border-radius:14px;padding:1.2rem 1.5rem;margin-bottom:2rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.8rem;box-shadow:0 1px 3px rgba(0,0,0,.05);}
.progress-info{font-size:.82rem;color:var(--slate);font-weight:700;}
.progress-info span{color:var(--charcoal);}
.btn-submit{padding:12px 32px;background:var(--green);color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:900;cursor:pointer;transition:all .15s;font-family:inherit;}
.btn-submit:hover{background:#059669;transform:translateY(-1px);box-shadow:0 4px 12px rgba(16,185,129,.3);}
.btn-submit:disabled{background:var(--border);color:var(--slate);cursor:not-allowed;transform:none;box-shadow:none;}

/* ── Result Banner ── */
.result-banner{background:linear-gradient(135deg,#1e3a5f,#1A1D23);border:1px solid var(--dark3);border-radius:14px;padding:2rem;text-align:center;margin-bottom:1.5rem;color:#fff;}
.result-score{font-size:3rem;font-weight:900;color:var(--amber);}
.result-grade{font-size:1.2rem;font-weight:800;margin-top:.3rem;}
.result-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-top:1.5rem;}
.result-meta-item{background:rgba(255,255,255,.08);border-radius:10px;padding:.8rem;}
.result-meta-label{font-size:.7rem;color:rgba(255,255,255,.5);font-weight:700;text-transform:uppercase;margin-bottom:.3rem;}
.result-meta-val{font-size:1rem;font-weight:900;color:#fff;}

/* ── Alert ── */
.alert{padding:1rem 1.5rem;border-radius:10px;font-weight:700;font-size:.88rem;margin-bottom:1rem;display:none;}
.alert.show{display:block;}
.alert-red{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.3);color:var(--red);}
.alert-green{background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.3);color:var(--green);}

/* ── Review Header ── */

.exam-locked .opt{opacity:.5;cursor:not-allowed;pointer-events:none;}
.exam-locked .tf-btn{opacity:.5;cursor:not-allowed;pointer-events:none;}
.exam-locked .fi-ans{opacity:.5;cursor:not-allowed;pointer-events:none;}
.exam-locked select.fi{opacity:.5;cursor:not-allowed;pointer-events:none;}
.exam-locked .btn-submit{opacity:.4;cursor:not-allowed;pointer-events:none;}
.exam-status-bar{padding:.8rem 1.2rem;border-radius:10px;font-weight:800;font-size:.88rem;margin-bottom:1rem;text-align:center;}
.exam-status-waiting{background:rgba(100,116,139,.1);border:1px solid rgba(100,116,139,.3);color:#64748b;}
.exam-status-paused{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);color:#F59E0B;}
.exam-status-running{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);color:#10B981;}

@media(max-width:600px){
  .info-grid{grid-template-columns:1fr;}
  .match-row{grid-template-columns:1fr;}
  .result-meta{grid-template-columns:1fr 1fr;}
  .header-inner{flex-direction:column;align-items:flex-start;}
}
</style>

  h += '<div class="q-num">Question '+num+'</div>';
  h += '<div class="q-text">'+esc(q.q||q.title||'')+'</div>';
  h += '<div class="q-marks">('+(q.marks||1)+' mark'+(q.marks>1?'s':'')+')</div>';
  h += '<div class="opts" id="mcq-opts-'+i+'">';
  (q.opts||[]).forEach(function(opt,j){
    var isSelected = myAns===j;
    var isCorrect  = submitted && j===q.ans;
    var isWrong    = submitted && isSelected && j!==q.ans;
    var locked = !submitted&&(examStatus==='waiting'||examStatus==='paused');
    var cls = 'opt'+(isSelected?' selected':'')+(isCorrect?' correct':'')+(isWrong?' wrong':'')+(locked?' exam-locked':'');
    h += '<label class="'+cls+'" data-type="mcq" data-qi="'+i+'" data-val="'+j+'">';
    h += '<input type="radio" name="mcq-'+i+'" value="'+j+'"'+(isSelected?' checked':'')+(submitted||locked?' disabled':'')+'>';
    h += '<span class="opt-letter">'+L[j]+'</span>';
    h += '<span class="opt-label">'+esc(opt)+'</span>';
    if(isCorrect && submitted) h += ' <span style="color:var(--green);font-size:.75rem;font-weight:800;">✓ Correct</span>';
    h += '</label>';
  });
  h += '</div>';
  if(submitted && myAns!==undefined && myAns!==q.ans){
    h += '<div class="answer-key">✅ Correct answer: '+L[q.ans]+') '+esc((q.opts||[])[q.ans])+'</div>';
  }
  h += '</div>';
  return h;
}

function renderTF(q,i,num){
  var myAns = answers['tf_'+i];
  var h = '<div class="question">';
  h += '<div class="q-num">Question '+num+'</div>';
  h += '<div class="q-text">'+esc(q.q||q.title||'')+'</div>';
  h += '<div class="q-marks">('+(q.marks||1)+' mark'+(q.marks>1?'s':'')+')</div>';
  h += '<div class="tf-opts">';
  var trueSelected = myAns===true;
  var falseSelected = myAns===false;
  var trueCls = 'tf-btn tf-true'+(trueSelected?' selected':'')+(submitted&&q.ans===true?' correct':'')+(submitted&&trueSelected&&q.ans!==true?' wrong':'');
  var falseCls = 'tf-btn tf-false'+(falseSelected?' selected':'')+(submitted&&q.ans===false?' correct':'')+(submitted&&falseSelected&&q.ans!==false?' wrong':'');
  var tfLocked=!submitted&&(examStatus==='waiting'||examStatus==='paused');
  h += '<button class="'+trueCls+'" data-type="tf" data-qi="'+i+'" data-val="true"'+(submitted||tfLocked?' disabled':'')+' onclick="selectTF(this,\'tf\','+i+',true)">✓ True</button>';
  h += '<button class="'+falseCls+'" data-type="tf" data-qi="'+i+'" data-val="false"'+(submitted||tfLocked?' disabled':'')+' onclick="selectTF(this,\'tf\','+i+',false)">✗ False</button>';
  h += '</div>';
  if(submitted && myAns!==undefined && myAns!==q.ans){
    h += '<div class="answer-key">✅ Correct answer: '+(q.ans?'True':'False')+'</div>';
  }
  h += '</div>';
  return h;
}

function renderFill(q,i,num){
  var myAns = answers['fill_'+i]||'';
  var correct = submitted && myAns.trim().toLowerCase()===(q.ans||'').trim().toLowerCase();
  var h = '<div class="question">';
  h += '<div class="q-num">Question '+num+'</div>';
  h += '<div class="q-text">'+esc(q.q||q.title||'')+'</div>';
  h += '<div class="q-marks">('+(q.marks||1)+' mark'+(q.marks>1?'s':'')+')</div>';
  var fillLocked=!submitted&&(examStatus==='waiting'||examStatus==='paused');
  h += '<input class="fi-ans" id="fill-'+i+'" type="text" placeholder="Type your answer here..." value="'+esc(myAns)+'" '+(submitted||fillLocked?'disabled':'')+' oninput="answers[\'fill_\'+'+i+']=this.value">';
  if(submitted){
    if(correct) h += '<div class="answer-key">✅ Correct!</div>';
    else h += '<div class="answer-key">✅ Correct answer: '+esc(q.ans)+'</div>';
  }
  h += '</div>';
  return h;
}

function renderMatch(q,i,num){
  var myAns = answers['match_'+i]||{};
  var rights = (q.pairs||[]).map(function(p){return p.right;}).slice();
  if(!submitted) rights.sort(function(){return Math.random()-.5;});
  var h = '<div class="question">';
  h += '<div class="q-num">Question '+num+' — Match each item</div>';
  h += '<div class="q-text">'+esc(q.title||q.q||'Match the following:')+'</div>';
  h += '<div class="q-marks">('+(q.marks||1)+' mark'+(q.marks>1?'s':'')+')</div>';
  (q.pairs||[]).forEach(function(p,j){
    h += '<div class="match-row">';
    h += '<div class="match-left">'+esc(p.left)+'</div>';
    if(submitted){
      var myVal = myAns[j]||'(No answer)';
      var isRight = myVal===p.right;
      h += '<div style="padding:.5rem .9rem;border-radius:8px;font-weight:700;font-size:.88rem;background:'+(isRight?'rgba(34,197,94,.15)':'rgba(239,68,68,.1)')+';border:1px solid '+(isRight?'var(--green)':'var(--red)')+';">'+esc(myVal)+'</div>';
      if(!isRight) h += '<div class="answer-key" style="grid-column:1/-1;">✅ Correct: '+esc(p.right)+'</div>';
    } else {
      h += '<select class="fi" id="match-'+i+'-'+j+'" onchange="setMatchAns('+i+','+j+',this.value)">';
      h += '<option value="">-- Select --</option>';
      rights.forEach(function(r){ h += '<option value="'+esc(r)+'"'+(myAns[j]===r?' selected':'')+'>'+esc(r)+'</option>'; });
      h += '</select>';
    }
    h += '</div>';
  });
  h += '</div>';
  return h;
}

function renderMS(q,i,num){
  var myAns = answers['ms_'+i]||[];
  var h = '<div class="question">';
  h += '<div class="q-num">Question '+num+' — Select all that apply</div>';
  h += '<div class="q-text">'+esc(q.q||q.title||'')+'</div>';
  h += '<div class="q-marks">('+(q.marks||1)+' mark'+(q.marks>1?'s':'')+')</div>';
  h += '<div class="opts" id="ms-opts-'+i+'">';
  (q.opts||[]).forEach(function(opt,j){
    var isSelected = myAns.indexOf(j)>=0;
    var isCorrect  = submitted && (q.correct||[]).indexOf(j)>=0;
    var isWrong    = submitted && isSelected && (q.correct||[]).indexOf(j)<0;
    var cls = 'opt'+(isSelected?' selected':'')+(isCorrect?' correct':'')+(isWrong?' wrong':'');
    h += '<label class="'+cls+'" data-type="ms" data-qi="'+i+'" data-val="'+j+'">';
    var msLocked=!submitted&&(examStatus==='waiting'||examStatus==='paused');
    h += '<input type="checkbox" name="ms-'+i+'" value="'+j+'"'+(isSelected?' checked':'')+(submitted||msLocked?' disabled':'')+'>';
    h += '<span class="opt-letter">'+L[j]+'</span>';
    h += '<span class="opt-label">'+esc(opt)+'</span>';
    if(isCorrect && submitted) h += ' <span style="color:var(--green);font-size:.75rem;font-weight:800;">✓</span>';
    h += '</label>';
  });
  h += '</div></div>';
  return h;
}

function renderEssay(q,i,num){
  var myAns = answers['essay_'+i]||'';
  var h = '<div class="question">';
  h += '<div class="q-num">Question '+num+'</div>';
  h += '<div class="q-text">'+esc(q.q||q.title||'')+'</div>';
  if(q.key && submitted) h += '<div class="answer-key">✅ Key points: '+esc(q.key)+'</div>';
  h += '<div class="q-marks">('+(q.marks||1)+' mark'+(q.marks>1?'s':'')+')</div>';
  var essayLocked=!submitted&&(examStatus==='waiting'||examStatus==='paused');
  h += '<textarea class="fi-ans" id="essay-'+i+'" rows="4" placeholder="Write your answer here..." '+(submitted||essayLocked?'disabled':'')+' oninput="answers[\'essay_\'+'+i+']=this.value">'+esc(myAns)+'</textarea>';
  h += '</div>';
  return h;
}

/* ── RESULT SCREEN ── */
function renderResult(){
  var cfg = getCfg();
  var meta = cfg.meta;
  var totalMarks = calcTotalMarks();
  var pct = totalMarks>0 ? Math.round(autoScore/totalMarks*100) : 0;
  var grade = pct>=80?'A':pct>=70?'B':pct>=60?'C':pct>=50?'D':'F';
  var emoji = pct>=80?'🏆':pct>=60?'🎉':pct>=50?'👍':'📚';

  var h = '<div class="header"><div class="header-inner">';
  h += '<div><div class="header-title">'+esc(meta.title||'Exam')+'</div>';
  h += '<div class="header-sub">Submitted successfully</div></div>';
  h += '<div class="timer-box">Done ✓</div>';
  h += '</div></div>';
  h += '<div class="main">';
  h += '<div class="result-banner">';
  h += '<div style="font-size:2.5rem;margin-bottom:.5rem;">'+emoji+'</div>';
  h += '<div class="result-score">'+autoScore+' / '+totalMarks+'</div>';
  h += '<div class="result-grade" style="color:'+(grade==='A'?'var(--green)':grade==='F'?'var(--red)':'var(--yellow)')+';">Grade '+grade+' &nbsp;·&nbsp; '+pct+'%</div>';
  h += '<div class="result-meta">';
  h += '<div class="result-meta-item"><div class="result-meta-label">Name</div><div class="result-meta-val">'+esc(sName||'—')+'</div></div>';
  h += '<div class="result-meta-item"><div class="result-meta-label">Class</div><div class="result-meta-val">'+esc(sCls||'—')+'</div></div>';
  h += '<div class="result-meta-item"><div class="result-meta-label">Subject</div><div class="result-meta-val">'+esc(meta.subject||'IT')+'</div></div>';
  h += '</div>';
  h += '<div style="margin-top:1rem;font-size:.78rem;color:#64748b;">Essay & Matching questions are marked by your teacher</div>';
  h += '<div style="margin-top:1rem;">';
  h += '<button class="btn-submit" onclick="reviewExam()" style="background:var(--blue);">📋 Review My Answers</button>';
  h += '</div>';
  h += '</div></div>';
  return h;
}

/* ── WIRE CLICKS ── */
function wireOptions(){
  document.querySelectorAll('.opt').forEach(function(el){
    el.addEventListener('click', function(){
      if(submitted) return;
      if(examStatus==='waiting'||examStatus==='paused') return;
      var type = el.dataset.type;
      var qi   = parseInt(el.dataset.qi);
      var val  = parseInt(el.dataset.val);
      if(type==='mcq'){
        document.querySelectorAll('#mcq-opts-'+qi+' .opt').forEach(function(o){o.classList.remove('selected');});
        el.classList.add('selected');
        el.querySelector('input').checked = true;
        answers['mcq_'+qi] = val;
      } else if(type==='ms'){
        el.classList.toggle('selected');
        var cb = el.querySelector('input');
        cb.checked = !cb.checked;
        var sel = [];
        document.querySelectorAll('#ms-opts-'+qi+' input:checked').forEach(function(c){sel.push(parseInt(c.value));});
        answers['ms_'+qi] = sel;
      }
    });
  });
}

function selectTF(btn,type,qi,val){
  if(submitted) return;
  if(examStatus==='waiting'||examStatus==='paused') return;
  btn.parentElement.querySelectorAll('.tf-btn').forEach(function(b){b.classList.remove('selected');});
  btn.classList.add('selected');
  answers['tf_'+qi] = val;
}

function setMatchAns(qi,j,val){
  if(!answers['match_'+qi]) answers['match_'+qi]={};
  answers['match_'+qi][j] = val;
}

/* ── TIMER ── */
function startTimer(minutes){
  if(!minutes || parseInt(minutes)<=0){
    var td = document.getElementById('timer-display');
    if(td) td.textContent = 'No limit';
    return;
  }
  timeLeft = parseInt(minutes) * 60;
  if(timerInterval) clearInterval(timerInterval);
  updateTimerDisplay();
  timerInterval = setInterval(function(){
    timeLeft--;
    updateTimerDisplay();
    if(timeLeft<=0){ clearInterval(timerInterval); submitExam(true); }
  },1000);
}

function updateTimerDisplay(){
  var el = document.getElementById('timer-display');
  if(!el) return;
  var m = Math.floor(timeLeft/60);
  var s = timeLeft%60;
  el.textContent = (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  if(timeLeft<=120) el.classList.add('danger');
  else el.classList.remove('danger');
}

/* ── SCORE ── */
function calcAutoScore(){
  var cfg = getCfg(); var score = 0;
  cfg.mcq.forEach(function(q,i){ if(answers['mcq_'+i]===q.ans) score+=(q.marks||1); });
  cfg.tf.forEach(function(q,i){ if(String(answers['tf_'+i])===String(q.ans)) score+=(q.marks||1); });
  cfg.fill.forEach(function(q,i){
    var a=String(answers['fill_'+i]||'').trim().toLowerCase();
    var k=String(q.ans||'').trim().toLowerCase();
    if(a&&a===k) score+=(q.marks||1);
  });
  cfg.ms.forEach(function(q,i){
    if((answers['ms_'+i]||[]).slice().sort().join(',') === (q.correct||[]).slice().sort().join(',')) score+=(q.marks||1);
  });
  return score;
}

function calcTotalMarks(){
  var cfg = getCfg();
  return ['mcq','tf','fill','match','ms','essay'].reduce(function(s,t){
    return s+(cfg[t]||[]).reduce(function(ss,q){return ss+(q.marks||1);},0);
  },0);
}

/* ── SUBMIT ── */
async function submitExam(auto){
  if(submitted) return;
  if((examStatus==='waiting'||examStatus==='paused')&&!auto) return;
  if(timerInterval){ clearInterval(timerInterval); timerInterval=null; }

  /* Read student info from DOM FIRST before anything else */
  var nameEl = document.getElementById('s-name');
  var sidEl  = document.getElementById('s-id');
  var clsEl  = document.getElementById('s-cls');
  var dateEl = document.getElementById('s-date');

  var name = nameEl ? nameEl.value : '';
  var sid  = sidEl  ? sidEl.value  : '';
  var cls  = clsEl  ? clsEl.value  : '';
  var date = dateEl ? dateEl.value  : '';

  /* Validate */
  if(!auto){
    if(!name.trim()){ showAlert('Please enter your full name.','red'); return; }
    if(!cls){ showAlert('Please select your class.','red'); return; }
  }

  /* Store in globals IMMEDIATELY */
  sName = name.trim() || '(No name)';
  sCls  = cls || '—';
  sSid  = sid.trim();

  var cfg = getCfg();
  var meta = cfg.meta;
  autoScore = calcAutoScore();
  var totalMarks = calcTotalMarks();

  /* Build payload */
  var payload = {
    'Exam Title':  meta.title||'Exam',
    'Exam Grade':  meta.grade||'',
    'Exam Term':   meta.term||'',
    'Name':        sName,
    'Student ID':  sSid,
    'Class':       sCls,
    'Date':        date,
    'Auto Score':  autoScore,
    'Total Marks': totalMarks
  };

  cfg.mcq.forEach(function(q,i){
    var val=answers['mcq_'+i];
    payload['MCQ Q'+(i+1)] = val!==undefined ? L[val]+') '+(q.opts||[])[val] : '(No answer)';
  });
  cfg.tf.forEach(function(q,i){
    var val=answers['tf_'+i];
    payload['TF Q'+(i+1)] = val!==undefined ? (val?'True':'False') : '(No answer)';
  });
  cfg.fill.forEach(function(q,i){
    payload['Fill Q'+(i+1)] = answers['fill_'+i]||'(No answer)';
  });
  cfg.match.forEach(function(q,i){
    var m=answers['match_'+i]||{};
    payload['Match Q'+(i+1)] = (q.pairs||[]).map(function(p,j){return p.left+' → '+(m[j]||'?');}).join(' | ');
  });
  cfg.ms.forEach(function(q,i){
    var val=answers['ms_'+i]||[];
    payload['MS Q'+(i+1)] = val.length ? val.map(function(v){return L[v]+') '+(q.opts||[])[v];}).join(', ') : '(No answer)';
  });
  cfg.essay.forEach(function(q,i){
    payload['Essay Q'+(i+1)] = answers['essay_'+i]||'(No answer)';
  });

  showAlert('Submitting...','');
  try{
    var params = Object.keys(payload).map(function(k){
      return encodeURIComponent(k)+'='+encodeURIComponent(payload[k]);
    }).join('&');
    await fetch(SURL+'?action=submit&'+params+'&t='+Date.now(),{method:'GET',mode:'cors'});
  }catch(e){ console.warn('Submit error:',e); }

  submitted = true;
  render();
}

/* ── REVIEW ── */
function reviewExam(){
  reviewing = true;
  render();
}

/* ── HELPERS ── */
function showAlert(msg,type){
  var el=document.getElementById('alert-box');
  if(!el) return;
  el.textContent=msg;
  el.className='alert show'+(type==='red'?' alert-red':type==='green'?' alert-green':'');
  if(type) setTimeout(function(){el.classList.remove('show');},4000);
}

function esc(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ── EXAM CONTROL POLLING ── */
function ecGetExamId(){
  var cfg=getCfg();
  return (cfg.meta.title||'exam').replace(/[^a-z0-9]/gi,'_').toLowerCase();
}

async function ecPoll(){
  if(submitted) return;
  try{
    var id=ecGetExamId();
    var r=await fetch(SURL+'?action=examGetStatus&examId='+encodeURIComponent(id)+'&t='+Date.now(),{method:'GET',mode:'cors'});
    var j=await r.json();
    if(!j.ok) return;
    var newStatus=j.status||'waiting';
    if(newStatus===examStatus) return;
    examStatus=newStatus;
    if(examStatus==='running'){
      /* Start timer if not already running */
      var cfg=getCfg();
      var dur=parseInt(cfg.meta.duration)||0;
      startTimer(dur);
    } else if(examStatus==='paused'){
      if(timerInterval){ clearInterval(timerInterval); timerInterval=null; }
    } else if(examStatus==='stopped'){
      clearInterval(ecPollTimer);
      submitExam(true);
      return;
    }
    render();
  }catch(e){ console.warn('ecPoll error:',e); }
}

function ecStartPolling(){
  if(ecPollTimer) clearInterval(ecPollTimer);
  ecPollTimer=setInterval(ecPoll, 2000);
  ecPoll(); /* immediate first check */
}

/* ── INIT ── */
render();
ecStartPolling();
</script>
